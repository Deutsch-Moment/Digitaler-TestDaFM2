<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TestDaF Übung – Text &amp; Fragen</title>
<style>
  :root{
    --primary:#0e6e8c;
    --accent:#c8102e;
    --bg-box:#dde3e8;
    --border:#0e6e8c;
  }
  *{box-sizing:border-box; font-family: Arial, Helvetica, sans-serif;}
  body{margin:0; padding:20px; background:#f4f6f7; color:#222;}
  .header{background:var(--primary); color:#fff; padding:14px 20px; font-size:22px; font-weight:bold; border-radius:4px 4px 0 0;}
  .instructions{background:#eaf1f4; padding:16px 20px; font-size:15px; line-height:1.5;}
  .timer{display:inline-block; border:2px solid var(--primary); border-radius:50%; width:70px; height:70px; text-align:center; line-height:70px; font-weight:bold; color:var(--primary); margin-top:10px;}
  .toolbar{display:flex; justify-content:flex-end; gap:8px; padding:10px 20px 0 20px; background:#fff;}
  .toolbtn{width:38px; height:38px; border:1px solid var(--primary); background:#fff; color:var(--primary); border-radius:4px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px;}
  .toolbtn.small{font-size:12px;}
  .toolbtn.big{font-size:16px;}
  .toolbtn.active{background:var(--primary); color:#fff;}
  .main{display:flex; gap:16px; padding:10px 20px 20px 20px; background:#fff;}
  .textpanel{flex:1; max-height:600px; overflow-y:auto; padding-right:10px; border-right:1px solid #ccc; font: size 15px; line-height:1.6;}
  .textpanel h3{color:var(--primary);}
  .textpanel p{margin-bottom:16px;}
  .textpanel .pnum{font-weight:bold; color:var(--primary);}
  .textpanel mark.hl{background:#fdea63; cursor:pointer; border-radius:2px;}
  .textpanel.marking{cursor:text;}
  .qpanel{flex:1.2;}
  .qrow{background:var(--bg-box); border:1px solid #aab; border-radius:4px; margin-bottom:10px; overflow:hidden;}
  .qhead{padding:10px 14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-size: 15px;}
  .qhead b{color:var(--primary); margin-right:6px;}
  .qhead.answered{background:#eef3f5;}
  .qbody{display:none; padding:8px 14px 14px 14px; background:#fff;}
  .qbody.open{display:block;}
  .option{display:block; width:100%; text-align:left; padding:8px 10px; margin:4px 0; border:1px solid #bbb; border-radius:4px; background:#fdfdfd; cursor:pointer; user-select:text; font-size:15px;}
  .option.selected{border-color:var(--primary); background:#dceaf0;}
  .option.correct{border-color:green; background:#e3f7e3;}
  .option.wrong{border-color:var(--accent); background:#fbe4e7;}
  .option,
.option * {
    font-size: 15px !important;
}

.option{
    display:block;
    width:100%;
    text-align:left;
    padding:8px 10px;
    margin:4px 0;
    border:1px solid #bbb;
    border-radius:4px;
    background:#fdfdfd;
    cursor:pointer;
    user-select:text;
    font-size:15px;
}
  .footer{display:flex; justify-content:flex-end; gap:10px; padding:16px 20px;}
  button{background:var(--accent); color:#fff;; border:none; padding:10px 20px; border-radius:4px; font-size:15px; cursor:pointer;}
  button.secondary{background:#888;}
  #result{padding:0 20px 20px; font-weight:bold;}
  </style>
</head>
<body>

<div class="header">LESEN – Aufgabentyp 3: Text &amp; Fragen</div>

<div class="instructions">
  Lesen Sie den Text.<br>
  <strong>Beantworten Sie die Fragen 1–7.</strong><br>
  Klicken Sie die Fragen an und entscheiden Sie, welche Lösung passt.<br>
  Für jede Frage gibt es genau eine richtige Lösung.
  <div class="timer" id="timer">15:10</div>
</div>

<div class="toolbar">
  <button class="toolbtn small" onclick="changeFontSize(-1)" title="Verkleinern">A-</button>
  <button class="toolbtn big" onclick="changeFontSize(1)" title="Vergrößern">A+</button>
  <button class="toolbtn" id="markBtn" onclick="toggleMarking()" title="Markieren">✎</button>
</div>

<div class="main">
  <div class="textpanel" id="textpanel"></div>
  <div class="qpanel" id="qpanel"></div>
</div>

<div id="result"></div>

<div class="footer">

  <button class="action secondary" onclick="resetExercise()">
    Zurücksetzen
  </button>

  <button class="action" onclick="checkAnswers()">
    Prüfen
  </button>

  <button class="action" onclick="saveAT3AndGoToNext()">Weiter</button>
</button>

</div>

<script>
/* ============================================================
   HIER ANPASSEN: Neue Übung = Titel, Absätze und Fragen ersetzen.
   correct = Index (0=a, 1=b, 2=c, 3=d)
   ============================================================ */
const textTitle = "Warum erinnern wir uns an manche Gerüche?";

const paragraphs = [

"Ein bestimmter Geruch kann plötzlich eine längst vergessene Erinnerung hervorrufen: der Duft eines Parfüms erinnert an eine Person, der Geruch von frisch gebackenem Brot an die Kindheit oder der von feuchter Erde an einen bestimmten Urlaub. Dieses Phänomen ist keineswegs ungewöhnlich. Gerüche sind besonders eng mit persönlichen Erinnerungen verbunden und können dabei Gefühle auslösen, die lange zurückzuliegen scheinen. Allerdings bedeutet das nicht, dass Gerüche grundsätzlich zuverlässigere Erinnerungen hervorrufen als andere Sinneseindrücke. Vielmehr scheint ihre besondere Wirkung darin zu liegen, dass Geruchswahrnehmungen bestimmte Bereiche des Gehirns unmittelbar erreichen.",

"Eine Erklärung dafür findet sich im Aufbau des menschlichen Gehirns. Während Informationen aus anderen Sinnesorganen zunächst mehrere Verarbeitungsstationen durchlaufen, ist der Weg von Geruchsinformationen zu bestimmten Hirnregionen vergleichsweise kurz. Dabei stehen insbesondere der sogenannte Hippocampus und die Amygdala miteinander in Verbindung. Der Hippocampus spielt eine wichtige Rolle bei der Speicherung und dem Abruf von Erinnerungen, während die Amygdala an der Verarbeitung von Emotionen beteiligt ist. Die enge Verbindung dieser Bereiche könnte daher erklären, warum Gerüche häufig nicht nur eine Erinnerung, sondern gleichzeitig auch die damit verbundenen Gefühle zurückbringen.",

"Interessant ist jedoch, dass Gerüche nicht automatisch besonders genaue Erinnerungen erzeugen. Untersuchungen zeigen vielmehr, dass Menschen sich bei geruchsbezogenen Erinnerungen häufig an die emotionale Atmosphäre einer Situation erinnern, während konkrete Einzelheiten weniger klar bleiben. So kann jemand beispielsweise noch genau wissen, dass ein bestimmter Geruch ein Gefühl von Sicherheit oder Geborgenheit auslöst, sich aber kaum daran erinnern, wann und wo dieser Geruch erstmals wahrgenommen wurde. Die emotionale Stärke einer Erinnerung und ihre sachliche Genauigkeit sind demnach nicht unbedingt dasselbe.",

"Auch Unternehmen versuchen, sich diesen Zusammenhang zunutze zu machen. In Geschäften, Hotels oder Restaurants werden gezielt bestimmte Düfte eingesetzt, um bei Kunden eine angenehme Atmosphäre zu erzeugen. Die Hoffnung besteht darin, dass ein charakteristischer Geruch später unbewusst mit einer Marke oder einem bestimmten Ort verbunden wird. Wissenschaftlich lässt sich allerdings nicht eindeutig belegen, dass ein solcher Duft automatisch zu höheren Verkaufszahlen führt. Seine Wirkung hängt unter anderem davon ab, ob die Kunden den Geruch als angenehm empfinden und ob er zur jeweiligen Umgebung passt.",

"Für die Forschung sind Geruchserinnerungen aus einem weiteren Grund interessant. Da Gerüche starke emotionale Reaktionen hervorrufen können, untersuchen Wissenschaftler, ob sie auch bei der Behandlung bestimmter psychischer Belastungen eingesetzt werden könnten. Erste Ansätze beschäftigen sich beispielsweise damit, angenehme Gerüche mit positiven Erinnerungen zu verbinden. Dadurch soll ein Zugang zu Erfahrungen geschaffen werden, die sprachlich nur schwer auszudrücken sind. Von einer etablierten Therapie kann jedoch noch keine Rede sein, da die bisherigen Ergebnisse nicht ausreichen, um die Methode allgemein zu empfehlen.",

"Warum manche Menschen besonders empfindlich auf Gerüche reagieren und andere kaum, ist ebenfalls noch nicht vollständig geklärt. Eine Rolle spielen vermutlich sowohl biologische Voraussetzungen als auch persönliche Erfahrungen. Wer einen bestimmten Geruch bereits in der Kindheit häufig wahrgenommen hat, reagiert möglicherweise anders darauf als jemand, der ihm erst im Erwachsenenalter begegnet. Auch Alter, Aufmerksamkeit und der aktuelle emotionale Zustand können beeinflussen, wie ein Geruch wahrgenommen und später erinnert wird. Gerüche sind somit weit mehr als bloße Signale, die uns über unsere Umgebung informieren. Sie können Erinnerungen aktivieren, Emotionen beeinflussen und möglicherweise sogar therapeutisch genutzt werden. Gleichzeitig darf ihre Wirkung nicht überschätzt werden: Eine intensive Erinnerung ist nicht automatisch eine genaue Erinnerung, und viele der vermuteten Anwendungen befinden sich noch im Forschungsstadium. Gerade diese Verbindung von Wahrnehmung, Gedächtnis und Emotion macht den Geruchssinn für die Wissenschaft zu einem besonders interessanten Untersuchungsfeld.",

];

const questions = [

  { stem:"In Absatz 1 wird gesagt, dass …",
    options:[
      "Gerüche grundsätzlich bessere Erinnerungen hervorrufen als andere Sinneseindrücke.",
      "Gerüche Erinnerungen und die damit verbundenen Gefühle auslösen können.",
      "persönliche Erinnerungen hauptsächlich durch Gerüche entstehen.",
      "Gerüche vor allem Erinnerungen aus der frühen Kindheit aktivieren."
    ],
    correct:1 },

  { stem:"Wodurch lässt sich laut Absatz 2 die besondere Wirkung von Gerüchen erklären?",
    options:[
      "Durch die besonders schnelle Verbindung von Geruchsinformationen mit bestimmten Hirnbereichen.",
      "Durch die stärkere Aktivität des Hippocampus bei emotionalen Erinnerungen.",
      "Durch die gleichzeitige Verarbeitung von Gerüchen und anderen Sinneseindrücken.",
      "Durch die Fähigkeit der Amygdala, Erinnerungen dauerhaft zu speichern."
    ],
    correct:0 },

  { stem:"Welche der folgenden Überschriften passt inhaltlich am besten zu Absatz 3?",
    options:[
      "Warum Gerüche Erinnerungen besonders genau speichern",
      "Der Einfluss von Emotionen auf die Geruchswahrnehmung",
      "Emotionale Erinnerungen sind nicht unbedingt detaillierte Erinnerungen",
      "Wie Gerüche vergessene Einzelheiten wiederherstellen"
    ],
    correct:2 },

  { stem:"Laut Absatz 4 können Unternehmen Düfte einsetzen, um …",
    options:[
      "Kunden gezielt zum Kauf bestimmter Produkte zu bewegen.",
      "eine bestimmte emotionale Verbindung zu einem Ort oder einer Marke herzustellen.",
      "die Aufmerksamkeit der Kunden auf einzelne Produkte zu lenken.",
      "wissenschaftlich nachweisbar ihre Verkaufszahlen zu steigern."
    ],
    correct:1 },

  { stem:"Welche der folgenden Aussagen fasst den Inhalt von Absatz 5 korrekt zusammen?",
    options:[
      "Gerüche werden bereits erfolgreich als Bestandteil psychotherapeutischer Verfahren eingesetzt.",
      "Wissenschaftler untersuchen mögliche therapeutische Anwendungen von Geruchserinnerungen.",
      "Angenehme Gerüche können psychische Belastungen grundsätzlich beseitigen.",
      "Die Forschung hat inzwischen nachgewiesen, dass Geruchstherapien besonders wirksam sind."
    ],
    correct:1 },

  { stem:"Was beeinflusst laut Absatz 6, wie Menschen auf Gerüche reagieren?",
    options:[
      "Ausschließlich biologische Unterschiede.",
      "Vor allem die Häufigkeit, mit der ein Geruch wahrgenommen wird.",
      "Verschiedene biologische und persönliche Faktoren.",
      "Insbesondere das Alter und der emotionale Zustand einer Person."
    ],
    correct:2 },

  { stem:"Hauptanliegen des Textes ist es, …",
    options:[
      "die therapeutische Bedeutung von Geruchserinnerungen zu erklären.",
      "die wissenschaftliche Erforschung des menschlichen Geruchssinns kritisch zu bewerten.",
      "zu zeigen, wie Unternehmen und Therapeuten Gerüche gezielt einsetzen können.",
      "über den Zusammenhang zwischen Geruch, Erinnerung und Emotion zu informieren."
    ],
    correct:3 }

];
/* ============================================================ */

let userAnswers = new Array(questions.length).fill(null);
let timeLeft = 910;
let timerInterval;
let fontSize = 15;
let markingOn = false;
const letters = ['a','b','c','d'];

function changeFontSize(delta){
  fontSize = Math.min(22, Math.max(11, fontSize + delta));

  document.getElementById('textpanel').style.fontSize = fontSize + 'px';
}

function toggleMarking(){
  markingOn = !markingOn;
  const btn = document.getElementById('markBtn');
  const tp = document.getElementById('textpanel');
  btn.classList.toggle('active', markingOn);
  tp.classList.toggle('marking', markingOn);
}

function handleTextpanelMouseUp(){
  if(!markingOn) return;
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  const tp = document.getElementById('textpanel');
  const allowed =
  document.getElementById('textpanel').contains(range.commonAncestorContainer) ||
  document.getElementById('qpanel').contains(range.commonAncestorContainer);

if(!allowed) return;
  if(range.toString().trim() === '') { sel.removeAllRanges(); return; }
  try{
    const mark = document.createElement('mark');
    mark.className = 'hl';
    range.surroundContents(mark);
  }catch(e){
    // selection crosses element boundaries; skip silently
  }
  sel.removeAllRanges();
}


function handleTextpanelClick(e){
  const mark = e.target.closest('mark.hl');
  if(mark){
    const parent = mark.parentNode;
    while(mark.firstChild) parent.insertBefore(mark.firstChild, mark);
    parent.removeChild(mark);
    parent.normalize();
  }
}

function buildExercise(){
  const tp = document.getElementById('textpanel');
  tp.innerHTML = `<h3>${textTitle}</h3>` +
  paragraphs.map((p,i)=>
    `<p class="paragraph-${i}">
      <span class="pnum">(${i+1})</span> ${p}
    </p>`
  ).join('');
  fontSize = 15;
  tp.style.fontSize = fontSize + 'px';
  markingOn = false;
  document.getElementById('markBtn').classList.remove('active');
  tp.classList.remove('marking');
  tp.onmouseup = handleTextpanelMouseUp;
  document.getElementById('qpanel').onmouseup = handleTextpanelMouseUp;
  tp.onclick = handleTextpanelClick;
  
  const qp = document.getElementById('qpanel');
  qp.innerHTML = '';
  userAnswers = new Array(questions.length).fill(null);

  questions.forEach((q, qi)=>{
    const row = document.createElement('div');
    row.className = 'qrow';

    const head = document.createElement('div');
    head.className = 'qhead';
    head.innerHTML = `<span><b>Frage ${qi+1}:</b> ${q.stem}</span><span>▾</span>`;
    head.onclick = ()=> toggleBody(qi);

    const body = document.createElement('div');
    body.className = 'qbody';
    body.id = 'qbody-'+qi;

    q.options.forEach((opt, oi)=>{
  const b = document.createElement('div');

  b.className = 'option';

  b.innerHTML =
    `<span class="option-letter">${letters[oi]})</span> ${opt}`;

  b.onclick = ()=> selectOption(qi, oi);

  body.appendChild(b);
});

    row.appendChild(head);
    row.appendChild(body);
    qp.appendChild(row);
  });

  document.getElementById('result').textContent = '';
  startTimer();
}

function toggleBody(qi){

  // Alle anderen Fragen schließen
  document.querySelectorAll('.qbody').forEach((body, i) => {
    if(i !== qi){
      body.classList.remove('open');
    }
  });

  // Nur die angeklickte Frage öffnen
  const body = document.getElementById('qbody-' + qi);
  body.classList.toggle('open');

  // Zum passenden Absatz springen
  const paragraph = document.querySelector(
    '#textpanel .paragraph-' + qi
  );

  if(paragraph){
    paragraph.scrollIntoView({
      behavior: 'smooth',
      block: 'center'
    });

    // Absatz hervorheben
    document.querySelectorAll('#textpanel p').forEach(p => {
      p.classList.remove('focus-paragraph');
    });

    paragraph.classList.add('focus-paragraph');
  }
}

function selectOption(qi, oi){
  userAnswers[qi] = oi;
  const body = document.getElementById('qbody-'+qi);
  [...body.children].forEach((btn, i)=>{
    btn.classList.toggle('selected', i===oi);
  });
  const heads = document.querySelectorAll('.qhead');
  heads[qi].classList.add('answered');
}

function saveAT3AndGoToNext(){
  let score = 0;

  questions.forEach((q, qi)=>{
    if(userAnswers[qi] === q.correct){
      score++;
    }
  });

  localStorage.setItem("Lesen_AT3.2", score);

  window.location.href = "Lesen_AT4.2.html";
}

function checkAnswers(){
  clearInterval(timerInterval);
  let score = 0;
  questions.forEach((q, qi)=>{
    const body = document.getElementById('qbody-'+qi);
    [...body.children].forEach((btn, oi)=>{
      btn.classList.remove('selected');
      if(oi === q.correct) btn.classList.add('correct');
      else if(oi === userAnswers[qi]) btn.classList.add('wrong');
    });
    body.classList.add('open');
    if(userAnswers[qi] === q.correct) score++;
  });
  const resultEl = document.getElementById('result');

  resultEl.style.color = score === questions.length ? 'green' : 'var(--accent)';
  resultEl.textContent = `Ergebnis: ${score} von ${questions.length} richtig.`;
}

function resetExercise(){
  clearInterval(timerInterval);
  timeLeft = 910;
  buildExercise();
}

function startTimer(){
  clearInterval(timerInterval);
  timeLeft = 910;
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft<=0){
      clearInterval(timerInterval);
      checkAnswers();
    }
  },1000);
}

function updateTimerDisplay(){
  const m = String(Math.floor(timeLeft/60)).padStart(2,'0');
  const s = String(timeLeft%60).padStart(2,'0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}

buildExercise();
</script>

</body>
</html>
