<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Schreiben – Aufgabe</title>
<style>
  :root{
    --primary:#0e6e8c;
    --accent:#c8102e;
  }
  *{box-sizing:border-box; font-family: Arial, Helvetica, sans-serif;}
  body{margin:0; padding:20px; background:#fff; color:#222;}
  .top{background:#eaf1f4; padding:20px 24px; display:flex; gap:24px; align-items:flex-start; border-radius:4px 4px 0 0;}
  .top .label{font-size:13px; color:#555; letter-spacing:0.05em; min-width:70px;}
  .top .tasknum{font-size:32px; font-weight:bold; min-width:70px;}
  .top .tasknum span{font-size:16px; color:#777; font-weight:normal;}
  .top .prompt{flex:1; font-size:14px; line-height:1.6;}
  .top .prompt .bold{font-weight:bold;}
  .top .prompt mark.hl{background:#fdea63; cursor:pointer; border-radius:2px;}
  .timer{display:inline-block; border:2px solid var(--primary); border-radius:50%; width:70px; height:70px; text-align:center; line-height:70px; font-weight:bold; color:var(--primary); margin-top:10px;}
  .toolbar{display:flex; justify-content:flex-end; gap:8px; padding:14px 24px 0 0;}
  .toolbtn{width:38px; height:38px; border:1px solid var(--primary); background:#fff; color:var(--primary); border-radius:4px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px;}
  .toolbtn.small{font-size:12px;}
  .toolbtn.big{font-size:18px;}
  .toolbtn.active{background:var(--primary); color:#fff;}
  .divider{border-bottom:2px solid var(--primary); margin:0 0 20px 0;}
  .writing-area{display:flex; gap:0; align-items:flex-start; padding:0 24px;}
  .charbar{display:flex; flex-direction:column; background:var(--accent); border-radius:4px 0 0 4px; overflow:hidden;}
  .charbar button{background:var(--accent); color:#fff; border:none; border-bottom:1px solid rgba(255,255,255,0.3); width:34px; height:34px; font-size:14px; cursor:pointer;}
  .charbar button:hover{background:#a80d24;}
  .editor-box{border:1px solid #999; border-left:none; border-radius:0 4px 4px 0; flex:1; max-width:600px; min-height:260px; padding:14px 16px; display:flex; flex-direction:column;}
  .editor-title{font-style:italic; color:#333; margin-bottom:10px; font-size:15px;}
  .editor-textarea{flex:1; border:none; outline:none; resize:vertical; font-size:14px; line-height:1.6; font-family:inherit; min-height:200px;}
  .wordcount{padding:8px 24px 0 24px; font-size:13px; color:#333;}
  .bottom-bar{display:flex; justify-content:flex-end; padding:24px; border-top:1px solid #ddd; margin-top:14px;}
  .navbtn{background:var(--accent); color:#fff; border:none; padding:12px 22px; border-radius:4px; font-size:14px; cursor:pointer; font-weight:bold;}
  .navbtn:hover{background:#a80d24;}
  .footer-brand{display:flex; align-items:center; gap:10px; margin:20px 24px 0; color:#888; font-size:14px;}
  .footer-brand .sq{width:34px; height:34px; background:linear-gradient(135deg,#0e6e8c,#3aa6c2); border-radius:6px;}
  .timeup-banner{display:none; background:#fbe4e7; color:var(--accent); padding:10px 24px; font-weight:bold; font-size:14px;}

.ai-analysis-area{
  padding:0 24px;
  margin-top:20px;
}

.ai-btn{
  background:#0e6e8c;
  color:#fff;
  border:none;
  padding:13px 22px;
  border-radius:4px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.ai-btn:hover{
  background:#095a72;
}

.ai-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.ai-status{
  margin-top:12px;
  font-size:13px;
  color:#666;
}

.ai-result{
  margin-top:16px;
  padding:20px;
  border:1px solid #ccc;
  border-left:4px solid #0e6e8c;
  border-radius:4px;
  background:#f8fafb;
  white-space:pre-wrap;
  line-height:1.7;
  font-size:14px;
}

</style>
</head>
<body>

<div class="top">
  <div>
    <div class="label">AUFGABE</div>
    <div class="tasknum">1 <span>/2</span></div>
  </div>
  <div class="prompt" id="promptBox"></div>
  <div class="timer" id="timerDisplay">30:00</div>
</div>

<div class="toolbar">
  <button class="toolbtn small" onclick="changeFontSize(-1)" title="Verkleinern">A-</button>
  <button class="toolbtn big" onclick="changeFontSize(1)" title="Vergrößern">A+</button>
  <button class="toolbtn" id="markBtn" onclick="toggleMarking()" title="Markieren">✎</button>
</div>

<div class="divider"></div>

<div class="timeup-banner" id="timeupBanner">Die Zeit ist abgelaufen. Sie können Ihren Text trotzdem noch überprüfen, bevor Sie fortfahren.</div>

<div class="writing-area">
  <div class="charbar" id="charbar"></div>
  <div class="editor-box">
    <div class="editor-title" id="editorTitle"></div>
    <textarea class="editor-textarea" id="editor" oninput="updateWordCount()" placeholder="Beginnen Sie hier zu schreiben …"></textarea>
  </div>
</div>

<div class="wordcount">Wörter: <span id="wordCountNum">0</span> <span id="minWordsNote"></span></div>

<div class="ai-analysis-area">
  <button class="ai-btn" id="aiAnalyzeBtn" onclick="analyzeWithAI()">
    🤖 Schreiben analysieren
  </button>

  <div id="aiStatus" class="ai-status"></div>

  <div id="aiResult" class="ai-result" style="display:none;"></div>
</div>

<div class="bottom-bar">
  <button class="navbtn" onclick="goNext()">Zurück zur Übersicht →</button>
</div>

<div class="footer-brand"><div class="sq"></div> Digitaler Schreibtest · Prüfungstraining</div>

<script>
/* ============================================================
   HIER ANPASSEN: Szenario/Aufgabentext, Titel im Schreibfeld,
   Mindestwortzahl, Zeit (Minuten) und Ziel-URL des "Weiter"-Buttons.
   ============================================================ */
const scenarioText = "Auf einer Lernplattform diskutieren Sie mit Ihrem Dozenten und anderen Seminarteilnehmenden über das Thema „Berufliche Mobilität“. Schreiben Sie einen kurzen Beitrag.";
const boldInstruction = "Erläutern und begründen Sie, welche positiven und negativen Aspekte es für Arbeitnehmer und Arbeitgeber haben kann, wenn Menschen oft ihre Arbeitsstelle wechseln.";
const editorTitleText = "Berufliche Mobilität";
const minWords = 200;
const totalMinutes = 30;
const nextPageURL = "aufgabe2.html"; // Passen Sie dies an die tatsächliche nächste Seite an
/* ============================================================ */

const specialChars = ["ä","Ä","ö","Ö","ü","Ü","ß"];

let fontSize = 14;
let markingOn = false;
let timeLeftSeconds = totalMinutes * 60;
let timerInterval = null;

function buildPrompt(){
  const box = document.getElementById('promptBox');
  box.innerHTML = `${scenarioText}<br><span class="bold">${boldInstruction}</span><br><br>Schreiben Sie mindestens <b>${minWords} Wörter</b>.<br>Sie haben <b>${totalMinutes} Minuten</b> Zeit.`;
  box.style.fontSize = fontSize + 'px';
  document.getElementById('editorTitle').textContent = editorTitleText;
  document.getElementById('minWordsNote').textContent = `(mindestens ${minWords})`;
}

function buildCharbar(){
  const bar = document.getElementById('charbar');
  bar.innerHTML = '';
  specialChars.forEach(ch=>{
    const b = document.createElement('button');
    b.textContent = ch;
    b.onclick = ()=> insertChar(ch);
    bar.appendChild(b);
  });
}

function insertChar(ch){
  const ta = document.getElementById('editor');
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const before = ta.value.substring(0, start);
  const after = ta.value.substring(end);
  ta.value = before + ch + after;
  ta.selectionStart = ta.selectionEnd = start + ch.length;
  ta.focus();
  updateWordCount();
}

function updateWordCount(){
  const text = document.getElementById('editor').value.trim();

  if (!text) {
    document.getElementById('wordCountNum').textContent = 0;
    return;
  }

  // Nur Wörter zählen – Satzzeichen werden ignoriert.
  const words = text.match(/[\p{L}\p{N}]+(?:[-'][\p{L}\p{N}]+)*/gu) || [];

  document.getElementById('wordCountNum').textContent = words.length;
}

function updateTimerDisplay(){
  const m = String(Math.floor(timeLeftSeconds/60)).padStart(2,'0');
  const s = String(timeLeftSeconds%60).padStart(2,'0');
  document.getElementById('timerDisplay').textContent = `${m}:${s}`;
}

function startTimer(){
  updateTimerDisplay();
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    timeLeftSeconds--;
    updateTimerDisplay();
    if(timeLeftSeconds<=0){
      clearInterval(timerInterval);
      document.getElementById('timeupBanner').style.display = 'block';
    }
  },1000);
}

function goNext(){
  window.location.href = nextPageURL;
}

function changeFontSize(delta){
  fontSize = Math.min(20, Math.max(12, fontSize + delta));
  document.getElementById('promptBox').style.fontSize = fontSize + 'px';
}

function toggleMarking(){
  markingOn = !markingOn;
  document.getElementById('markBtn').classList.toggle('active', markingOn);
}

document.getElementById('promptBox').addEventListener('mouseup', function(){
  if(!markingOn) return;
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  const box = document.getElementById('promptBox');
  if(!box.contains(range.commonAncestorContainer)) return;
  if(range.toString().trim() === '') { sel.removeAllRanges(); return; }
  try{
    const mark = document.createElement('mark');
    mark.className = 'hl';
    range.surroundContents(mark);
  }catch(e){}
  sel.removeAllRanges();
});

document.addEventListener('click', function(e){
  const mark = e.target.closest('mark.hl');
  if(mark){
    const parent = mark.parentNode;
    while(mark.firstChild) parent.insertBefore(mark.firstChild, mark);
    parent.removeChild(mark);
    parent.normalize();
  }
});

buildPrompt();
buildCharbar();
updateWordCount();
startTimer();

async function analyzeWithAI(){

  const editor = document.getElementById("editor");
  const text = editor.value.trim();

  const status = document.getElementById("aiStatus");
  const resultBox = document.getElementById("aiResult");
  const button = document.getElementById("aiAnalyzeBtn");

  if (!text) {
    status.textContent = "Bitte schreiben Sie zuerst einen Text.";
    return;
  }

  const wordMatches =
    text.match(/[\p{L}\p{N}]+(?:[-'][\p{L}\p{N}]+)*/gu) || [];

  const wordCount = wordMatches.length;

  if (wordCount < minWords) {
    const proceed = confirm(
      `Ihr Text enthält nur ${wordCount} Wörter. ` +
      `Die Aufgabe verlangt mindestens ${minWords} Wörter.\n\n` +
      `Möchten Sie trotzdem eine KI-Analyse durchführen?`
    );

    if (!proceed) {
      return;
    }
  }

  button.disabled = true;
  button.textContent = "⏳ Analyse läuft ...";
  status.textContent = "Der Text wird analysiert ...";
  resultBox.style.display = "none";
  resultBox.textContent = "";

  try {

    const response = await fetch("/api/analyse", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        text: text,
        task: scenarioText,
        instruction: boldInstruction,
        minWords: minWords
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Fehler bei der Analyse."
      );
    }

    resultBox.textContent = data.result || "Keine Analyse erhalten.";
    resultBox.style.display = "block";

    status.textContent =
      `Analyse abgeschlossen · ${wordCount} Wörter`;

  } catch (error) {

    console.error(error);

    status.textContent =
      "Die Analyse konnte nicht durchgeführt werden.";

    resultBox.textContent =
      "Fehler: " + error.message;

    resultBox.style.display = "block";

  } finally {

    button.disabled = false;
    button.textContent = "🤖 Schreiben analysieren";

  }
}

</script>

</body>
</html>
